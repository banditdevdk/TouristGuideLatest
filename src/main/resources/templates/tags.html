<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link th:href="@{/main.css}" rel="stylesheet">
    <title>Tags</title>
</head>
<body>
    <h1 th:text="${attraction.name} + ' Tags'"> </h1>
    <table>
        <thead> Tag </thead>
        <tbody>

        <tr th:if="${attraction.attractionTags.isEmpty()}">
            <td>There are no tags for this attraction yet</td>
        </tr>

        <tr th:each="tag : ${attraction.attractionTags}">
            <td th:text="${tag}"></td>
        </tr>

        </tbody>
    </table>

    <a th:href="@{/attractions}">
        <button>Go Back</button>
    </a>

</body>
</html>
